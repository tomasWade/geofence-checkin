server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/geofence_checkin
    username: geofence
    password: geofence123
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: dev-secret-0123456789abcdef0123456789abcdef-CHANGE-IN-PROD
  access-token-ttl-minutes: 120
  refresh-token-ttl-days: 14

checkin:
  mock-enabled: false

app:
  init-enabled: true

logging:
  level:
    com.geofence.checkin: debug
